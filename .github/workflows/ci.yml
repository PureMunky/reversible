name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: demos
        run: |
          go run ./cmd/demo
          go run ./cmd/storyline | tee story.txt
          grep -q "verdict: BLOCKED" story.txt
          grep -q "verdict: SAFE TO PROMOTE" story.txt
          grep -q "world unchanged by either replay" story.txt
          go run ./cmd/evolution | tee evo.txt
          grep -q "promoted \$52 over \$55" evo.txt
          grep -q "customers on \$65 after auto-rewind: 0" evo.txt
          grep -q "chain verifies" evo.txt
          grep -q "rejected by the calibrated gate" evo.txt
          go run ./cmd/autopilot | tee auto.txt
          grep -q "converged" auto.txt
          grep -q 'retire \$58' auto.txt
          grep -q "chain verifies" auto.txt
          go run ./cmd/designer | tee designer.txt
          grep -q "offline stand-in" designer.txt
          grep -q "premium-120 rejected by the gate" designer.txt
          grep -q "PROMOTE tiered" designer.txt
          grep -q "converged" designer.txt
          grep -q "chain verifies" designer.txt
          go run ./cmd/factory | tee factory.txt
          grep -q "9/9 examples pass" factory.txt
          grep -q "12/12 examples pass" factory.txt
          grep -q "Phil signs off on that reality" factory.txt
          (! grep -q "UNEXPLAINED" factory.txt)  # subshell: a bare `!` never fails a `set -e` script
          grep -q "cached: intent unchanged" factory.txt
          grep -q "written or edited by a person: 0" factory.txt
          grep -q "chain verifies" factory.txt
          grep -q "cleanup-bot has had 2 request(s) refused" factory.txt
          grep -q "Phil answers 2" factory.txt
          grep -q "were captured from production requests" factory.txt
          grep -q "no new findings" factory.txt
          grep -q "is released as a canary" factory.txt
          grep -q "no harm after" factory.txt
          grep -q "each keeps the other's fields" factory.txt
          go run ./cmd/factory -brittle-coder | tee brittle.txt
          grep -q "guardrail breach" brittle.txt
          grep -q "v1 serves everything" brittle.txt
          go run ./cmd/factory -show-prompts | tee prompts.txt
          grep -q "what the model would be sent (not sent: -show-prompts)" prompts.txt
          (! pgrep -f "factory-demo-.*/service")  # subshell: a bare `!` never fails a `set -e` script
          go run ./cmd/factory -faulty-coder | tee faulty.txt
          grep -q "UNEXPLAINED" faulty.txt
          grep -q "Phil does NOT sign off" faulty.txt
          go run ./cmd/incidents | tee incidents.txt
          grep -q "2 resources (services, incidents), 18 examples; the spec checker has 0 question(s)" incidents.txt
          grep -q "18/18 examples pass" incidents.txt
          grep -q "22/22 examples pass" incidents.txt
          grep -q "27/27 examples pass" incidents.txt
          (! grep -q "UNEXPLAINED" incidents.txt)  # subshell: a bare `!` never fails a `set -e` script
          grep -q "new access rule: only on-call may change incidents" incidents.txt
          grep -q "rules for incident.status changed" incidents.txt
          grep -q "each keeps the other's fields" incidents.txt
          grep -q "→ 2. let status-page-bot change incidents" incidents.txt
          grep -q "→ 1. keep refusing; on-call must change" incidents.txt
          grep -q "status-page-bot may now change incidents" incidents.txt
          grep -q "no new findings" incidents.txt
          grep -q "written or edited by a person: 0" incidents.txt
          grep -q "chain verifies" incidents.txt
          (! pgrep -f "incidents-demo-.*/service")  # subshell: a bare `!` never fails a `set -e` script
      - name: crash-recovery smoke test
        run: |
          go build -o agentctl ./cmd/agentctl
          ./agentctl -dir "$RUNNER_TEMP/st" onboard acme
          ./agentctl -dir "$RUNNER_TEMP/st" crash initech || test $? -eq 137
          ./agentctl -dir "$RUNNER_TEMP/st" status | tee out.txt
          grep -q "recovered onboard-initech from a crash: rolled_back" out.txt
          ./agentctl -dir "$RUNNER_TEMP/st" world | grep -q "workspaces=\[ws-acme\]"
          grep -q "onboard-acme *pending" out.txt

  # The kind environment end to end: the real image, the network rules
  # proven enforced, an offline run and a rehearsal of the live path
  # (cmd/fakeclaude stands in for the API; no key is used in CI).
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint the environment
        run: |
          shellcheck deploy/kind/run.sh
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          d="$RUNNER_TEMP/rendered"; mkdir -p "$d"
          sed -e s/__NAME__/x/ -e s/__MODE__/live/ -e s/__NETWORK__/model/ -e s/__DEMO__/incidents/ -e s/__ENVKIND__/secretRef/ -e s/__ENVNAME__/gateway-token/ -e s/__MODEL__// -e s/__MAXTOKENS__// -e 's#__GATEWAY_URL__#http://10.96.0.5:8080#' deploy/kind/manifests/demo-job.yaml > "$d/job.yaml"
          sed -e s/__NETWORK__/model/ -e s/__GATEWAY_IP__/10.96.0.5/ -e s/__K8S_IP__/10.96.0.1/ -e s/__DNS_IP__/10.96.0.10/ deploy/kind/manifests/isolation-check.yaml > "$d/iso.yaml"
          cp deploy/kind/manifests/base.yaml deploy/kind/manifests/fakeclaude.yaml deploy/kind/manifests/gateway.yaml deploy/kind/manifests/observe.yaml "$d/"
          python3 -c "import json; json.load(open('deploy/kind/observe/dashboard.json'))"
          "$RUNNER_TEMP/kubeconform" -strict -summary "$d"/*.yaml
      - name: install kind
        run: |
          curl -sSLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          chmod +x "$RUNNER_TEMP/kind" && sudo mv "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: up
        run: deploy/kind/run.sh up
      - name: network rules are enforced
        run: |
          deploy/kind/run.sh check | tee check.txt
          grep -q "an offline demo pod reaches nothing" check.txt
          grep -q "reaches the model gateway and nothing else" check.txt
          grep -q "the model gateway reaches the Anthropic API, and not the cluster API" check.txt
          grep -q "Network rules enforced" check.txt
      - name: observability
        run: deploy/kind/run.sh observe
      - name: offline run, then use and inspect it
        run: |
          deploy/kind/run.sh offline | tee offline.txt
          grep -q "27/27 examples pass" offline.txt
          grep -q "It's serving" offline.txt
          deploy/kind/run.sh open > pf.txt 2>&1 &
          pf=$!
          for i in $(seq 1 30); do curl -sf localhost:8080/_factory/ > inspect.txt && break; sleep 1; done
          cat inspect.txt
          grep -q "27/27 examples pass" inspect.txt
          curl -sf 'localhost:8080/incidents?status=resolved' | grep -q inc-
          curl -s -X PATCH -H 'X-Caller: dashboards' -d '{"summary":"x"}' localhost:8080/incidents/inc-106 | grep -q "may not change incidents"
          curl -sf localhost:8080/_factory/why | grep -q "answers to production's questions"
          curl -sf localhost:8080/metrics | tee metrics.txt | grep -q 'reversible_builds_total{service="incidents",outcome="passed"} 3'
          grep -q 'reversible_live_version{service="incidents",version="11ddf7968e63"} 1' metrics.txt
          curl -sf 'localhost:8080/_factory/events?kind=canary.promoted' | grep -q '"result":"promoted"'
          curl -sf 'localhost:8080/_factory/events?kind=finding' | grep -q 'status-page-bot'
          curl -sf localhost:8080/_factory/live | grep -q "EventSource"
          kill $pf
      - name: Prometheus scraped the run; Grafana has the dashboard
        run: |
          deploy/kind/run.sh dashboards > dash.txt 2>&1 &
          dash=$!
          for i in $(seq 1 30); do curl -sf localhost:9090/-/ready >/dev/null && curl -sf localhost:3000/api/health >/dev/null && break; sleep 2; done
          for i in $(seq 1 30); do
            curl -sf 'localhost:9090/api/v1/query?query=sum(reversible_builds_total)' | tee q.txt | grep -q '"3"' && break; sleep 2
          done
          cat q.txt; grep -q '"3"' q.txt
          curl -sf 'localhost:3000/api/search?query=Software%20built%20from%20intent' | grep -q '"uid":"reversible"'
          kill $dash 2>/dev/null || true
      - name: rehearsal of the live path
        run: |
          deploy/kind/run.sh rehearse | tee rehearse.txt
          grep -q "mode: live" rehearse.txt
          grep -q "overloaded_error: rehearsal: overloaded (retrying)" rehearse.txt
          grep -q "27/27 examples pass" rehearse.txt
          grep -q "It's serving" rehearse.txt
          grep -q "Sandbox checked: generated code can't see" rehearse.txt
          kubectl --context kind-reversible -n reversible logs deploy/model-gateway | tee gw.txt
          grep -q "forwarded: .*budget used: 3/15 calls" gw.txt
          # every generated service ran in the sandbox, none in the factory container
          kubectl --context kind-reversible -n reversible exec job/incidents-rehearsal -c factory -- sh -c '! grep -qs "builds/[0-9a-f][0-9a-f]*/service" /proc/[0-9]*/cmdline'
          kubectl --context kind-reversible -n reversible exec job/incidents-rehearsal -c sandbox -- sh -c 'grep -qs "builds/[0-9a-f][0-9a-f]*/service" /proc/[0-9]*/cmdline'
          kubectl --context kind-reversible -n reversible exec job/incidents-rehearsal -c factory -- wget -qO- http://127.0.0.1:8080/metrics > rmetrics.txt
          grep -q 'reversible_service_starts_total{where="sandbox"}' rmetrics.txt
          (! grep -q 'reversible_service_starts_total{where="local"}' rmetrics.txt)
      - name: diagnostics
        if: failure()
        run: |
          kubectl --context kind-reversible -n reversible get all,networkpolicy || true
          kubectl --context kind-reversible -n observe get all || true
          kubectl --context kind-reversible -n observe logs --tail=50 deploy/grafana || true
          kubectl --context kind-reversible -n reversible describe pods || true
          kubectl --context kind-reversible -n reversible logs --tail=200 --all-containers -l app.kubernetes.io/name=reversible-demo || true
          kubectl --context kind-reversible -n reversible logs --tail=50 deploy/model-gateway || true
