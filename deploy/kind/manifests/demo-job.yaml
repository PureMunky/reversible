# One demo run. run.sh fills in the __PLACEHOLDERS__ for the mode
# (offline, rehearsal, live) and the demo (incidents, factory).
#
# The pod runs the demo's whole story (build, release, canary, findings),
# then keeps production serving on 8080 with an inspector at /_factory/
# until the Job is deleted or two hours pass.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: reversible
  labels:
    app.kubernetes.io/name: reversible-demo
    reversible/mode: __MODE__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reversible-demo
        reversible/mode: __MODE__
        reversible/network: __NETWORK__
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false # model-written code runs here: no cluster credentials
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          image: reversible:dev
          imagePullPolicy: Never # loaded into kind by run.sh
          args: ["__DEMO__", "-keep", "-serve", ":8080"]
          envFrom:
            - __ENVKIND__:
                name: __ENVNAME__
          env:
            - {name: REVERSIBLE_MODEL, value: "__MODEL__"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: # ready once the story is over and production is serving
            httpGet: {path: /_factory/, port: http}
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: work # HOME and the Go build cache
          emptyDir: {sizeLimit: 2Gi}
        - name: tmp # builds, generated code and production data
          emptyDir: {sizeLimit: 2Gi}
