# The model gateway (cmd/modelgateway): the only pod with the Anthropic
# key and a route to the internet. The demo pod authenticates with a
# random per-run token; the gateway enforces the run's budget and
# forwards to api.anthropic.com (live) or the stand-in (rehearsal).
# run.sh writes model-gateway-config for each run and restarts it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-gateway
  namespace: reversible
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: model-gateway}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-gateway
        reversible/network: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: reversible:dev
          imagePullPolicy: Never
          args: ["modelgateway", "-addr", ":8080"]
          envFrom:
            - secretRef: {name: model-gateway-config} # mode, upstream, token, budget
          env:
            - name: ANTHROPIC_API_KEY # only here; never in the demo pod
              valueFrom:
                secretKeyRef: {name: anthropic, key: ANTHROPIC_API_KEY, optional: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: model-gateway
  namespace: reversible
spec:
  selector: {app.kubernetes.io/name: model-gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
